spring:
  application:
    name: tabibi-backend
  # Hors profil « postgres » (dev/tests) : pas de base — on desactive l'auto-config JPA/Liquibase.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.liquibase.LiquibaseAutoConfiguration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Emetteur des jetons = le realm Keycloak (fourni par docker-compose)
          issuer-uri: ${TABIBI_KEYCLOAK_ISSUER:http://localhost:8081/realms/tabibi}

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
