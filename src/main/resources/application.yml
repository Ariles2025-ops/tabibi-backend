spring:
  application:
    name: tabibi-backend
  # Hors profil « postgres » (dev/tests) : pas de base — on desactive l'auto-config JPA/Liquibase.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.liquibase.LiquibaseAutoConfiguration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Emetteur des jetons = le realm Keycloak (fourni par docker-compose)
          issuer-uri: ${TABIBI_KEYCLOAK_ISSUER:http://localhost:8081/realms/tabibi}

server:
  port: 8080

tabibi:
  cors:
    # Origines (schema://hote:port) autorisees a appeler l'API depuis un navigateur, separees par
    # des virgules : le serveur de dev Angular par defaut ; en production, l'origine publique du front.
    origines: ${TABIBI_CORS_ORIGINES:http://localhost:4200}
  web:
    # Adresse publique du front web : le QR code d'une ordonnance imprimee renvoie vers sa page de
    # verification (base-url/verifier?code=XXXX). En production, l'origine publique du front.
    base-url: ${TABIBI_WEB_BASE_URL:http://localhost:4200}
  teleconsultation:
    # Salle video Jitsi Meet (open source, sans SDK proprietaire) : instance publique par defaut,
    # remplacable par une instance auto-hebergee. Le lien d'une salle vaut base-url/salleId.
    base-url: ${TABIBI_TELECONSULTATION_BASE_URL:https://meet.jit.si}
  limite-debit:
    # Limitation de debit par adresse IP (seau a jetons, en memoire, sans dependance) sur les routes
    # publiques et les publications ; 429 + Retry-After au-dela du quota. false retire le filtre
    # (tests de charge, limitation deja assuree par le reverse proxy).
    actif: ${TABIBI_LIMITE_DEBIT_ACTIF:true}
    annuaire-par-minute: 120        # GET /api/medecins/** (recherche, fiche, creneaux, avis)
    verification-par-minute: 30     # GET /api/ordonnances/verifier/** (codes devinables par force brute sinon)
    publication-par-minute: 20      # POST /api/dawini/besoins, POST /api/conversations, POST /api/avis (chacun)
  rappels:
    # Rappel de rendez-vous 24 h avant, envoye toutes les heures par le planificateur ;
    # false coupe le planificateur (l'appel manuel POST /api/admin/rappels/executer reste possible).
    actifs: ${TABIBI_RAPPELS_ACTIFS:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
