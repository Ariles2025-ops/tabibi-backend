spring:
  # Le profil postgres reactive JPA/Liquibase (annule l'exclusion du profil par defaut).
  autoconfigure:
    exclude: ""
  datasource:
    # Variables standard de Spring Boot (docker-compose.prod.yml), valeurs par defaut = docker-compose.yml de dev.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tabibi}
    username: ${SPRING_DATASOURCE_USERNAME:tabibi}
    password: ${SPRING_DATASOURCE_PASSWORD:tabibi}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  # Derriere un reverse proxy (Caddy) : adresse et schema du client lus dans X-Forwarded-*, en
  # provenance des proxys internes seulement (RemoteIpValve de Tomcat) ; none pour un acces direct.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:native}

management:
  endpoint:
    health:
      # Sondes /actuator/health/liveness et /actuator/health/readiness pour les conteneurs et orchestrateurs.
      probes:
        enabled: true
