databaseChangeLog:
  - changeSet:
      id: 020-invitation-secretaire
      author: tabibi
      comment: "Rattachement de secretaire = invitation a accepter ; les rattachements existants restent actifs."
      changes:
        - addColumn:
            tableName: rattachement_secretaire
            columns:
              - column:
                  name: accepte
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
