databaseChangeLog:
  - changeSet:
      id: 006-teleconsultation
      author: tabibi
      changes:
        - createTable:
            tableName: teleconsultation
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: rendez_vous_id, type: uuid, constraints: { nullable: false } }
              - column: { name: patient_id, type: uuid, constraints: { nullable: false } }
              - column: { name: medecin_id, type: uuid, constraints: { nullable: false } }
              - column: { name: salle_id, type: varchar(64), constraints: { nullable: false, unique: true } }
              - column: { name: statut, type: varchar(16), constraints: { nullable: false } }
              - column: { name: consentement_patient_le, type: timestamptz }
              - column: { name: cree_le, type: timestamptz, constraints: { nullable: false } }
              - column: { name: demarree_le, type: timestamptz }
              - column: { name: terminee_le, type: timestamptz }
        - createIndex:
            indexName: idx_teleconsultation_patient
            tableName: teleconsultation
            columns:
              - column: { name: patient_id }
        - createIndex:
            indexName: idx_teleconsultation_medecin
            tableName: teleconsultation
            columns:
              - column: { name: medecin_id }
        - createIndex:
            indexName: idx_teleconsultation_rendez_vous
            tableName: teleconsultation
            columns:
              - column: { name: rendez_vous_id }
