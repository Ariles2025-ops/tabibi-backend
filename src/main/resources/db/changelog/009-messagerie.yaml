databaseChangeLog:
  - changeSet:
      id: 009-conversation
      author: tabibi
      changes:
        - createTable:
            tableName: conversation
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: patient_id, type: uuid, constraints: { nullable: false } }
              - column: { name: medecin_id, type: uuid, constraints: { nullable: false } }
              - column: { name: cree_le, type: timestamptz, constraints: { nullable: false } }
              - column: { name: dernier_message_le, type: timestamptz, constraints: { nullable: false } }
        - addUniqueConstraint:
            constraintName: uk_conversation_patient_medecin
            tableName: conversation
            columnNames: patient_id, medecin_id
        - createIndex:
            indexName: idx_conversation_patient
            tableName: conversation
            columns:
              - column: { name: patient_id }
        - createIndex:
            indexName: idx_conversation_medecin
            tableName: conversation
            columns:
              - column: { name: medecin_id }
  - changeSet:
      id: 009-message
      author: tabibi
      changes:
        - createTable:
            tableName: message
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: conversation_id, type: uuid, constraints: { nullable: false } }
              - column: { name: auteur_id, type: uuid, constraints: { nullable: false } }
              - column: { name: contenu, type: text, constraints: { nullable: false } }
              - column: { name: envoye_le, type: timestamptz, constraints: { nullable: false } }
              - column: { name: lu_le, type: timestamptz }
        - createIndex:
            indexName: idx_message_conversation_envoye_le
            tableName: message
            columns:
              - column: { name: conversation_id }
              - column: { name: envoye_le }
