name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Diag deps prometheus (temporaire)
        if: always()
        run: |
          {
            echo '## Deps micrometer / prometheus'
            echo '```'
            mvn -B -q dependency:tree -Dincludes='io.micrometer:*,io.prometheus:*' 2>&1 | tail -50
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build & tests
        run: mvn -B verify
      - name: Resume des tests en echec
        if: failure()
        run: |
          {
            echo '## Tests en echec (surefire)'
            echo
            found=0
            for f in target/surefire-reports/*.txt; do
              [ -e "$f" ] || continue
              if grep -q '<<< \(FAILURE\|ERROR\)!' "$f"; then
                found=1
                echo "### $(basename "$f")"
                echo '```'
                sed -n '1,90p' "$f"
                echo '```'
                echo
              fi
            done
            if [ "$found" = 0 ]; then echo '_Aucun rapport surefire en echec trouve._'; fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Image de production publiee sur GHCR : seulement sur la branche principale, une fois verify vert.
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nom de l'image en minuscules (exigence de GHCR)
        id: nom
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.nom.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
